<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADMIN · FUFU SLOTS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-red:    #e0254a;
      --c-blue:   #2c54d6;
      --c-cyan:   #00d4d4;
      --c-yellow: #f4d837;
      --c-purple: #8a3cdc;
      --c-pink:   #ff8cb6;
      --c-green:  #4cc24f;
      --c-orange: #ff8e34;
      --c-black:  #0a0a14;
      --c-ink:    #14081a;
      --c-white:  #f0f0f0;
      --c-bg:     #1a0d2e;
      --c-bg-2:   #2a1a4e;
      --c-frame:  #4a1d8a;
      --c-frame-hi: #b86bff;
      --c-frame-lo: #2a0d5a;
      --pixel-font: 'Press Start 2P', 'Courier New', monospace;
      --cn-font: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; image-rendering: pixelated; -webkit-font-smoothing: none; }
    body {
      font-family: var(--pixel-font);
      background: var(--c-bg);
      color: var(--c-white);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      line-height: 1.5;
    }
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image:
        linear-gradient(45deg, var(--c-bg-2) 25%, transparent 25%, transparent 75%, var(--c-bg-2) 75%),
        linear-gradient(45deg, var(--c-bg-2) 25%, transparent 25%, transparent 75%, var(--c-bg-2) 75%);
      background-size: 12px 12px;
      background-position: 0 0, 6px 6px;
      opacity: 0.45;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed; inset: 0; z-index: 200;
      pointer-events: none;
      background: repeating-linear-gradient(0deg,
        rgba(0,0,0,0.18) 0, rgba(0,0,0,0.18) 1px,
        transparent 1px, transparent 3px
      );
      mix-blend-mode: multiply;
    }
    canvas#starfield { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    .container {
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
      padding: 24px 12px 48px;
      position: relative;
      z-index: 5;
    }

    .page-title {
      text-align: center;
      font-family: var(--pixel-font);
      font-size: 22px;
      letter-spacing: 4px;
      color: var(--c-yellow);
      text-shadow:
        4px 0 0 var(--c-black), -4px 0 0 var(--c-black),
        0 4px 0 var(--c-black), 0 -4px 0 var(--c-black),
        4px 4px 0 var(--c-red), 4px 8px 0 var(--c-black);
      margin-bottom: 8px;
    }
    .page-sub {
      text-align: center;
      font-family: var(--cn-font);
      color: var(--c-cyan);
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 24px;
    }

    /* Auth row */
    .auth-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .px-input {
      padding: 12px 14px;
      font-family: var(--pixel-font);
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--c-yellow);
      background: var(--c-black);
      border: none;
      outline: none;
      box-shadow:
        inset 4px 4px 0 0 #000,
        inset -4px -4px 0 0 var(--c-purple),
        0 0 0 4px var(--c-cyan);
      width: 240px;
    }
    .px-input::placeholder { color: var(--c-purple); }
    .px-input:focus {
      box-shadow:
        inset 4px 4px 0 0 #000,
        inset -4px -4px 0 0 var(--c-purple),
        0 0 0 4px var(--c-yellow);
    }
    .px-btn {
      padding: 12px 16px;
      font-family: var(--pixel-font);
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--c-black);
      background: var(--c-yellow);
      border: none;
      cursor: pointer;
      box-shadow:
        inset 4px 4px 0 0 #fff8c8,
        inset -4px -4px 0 0 #b89a00,
        0 0 0 4px var(--c-black),
        0 4px 0 0 #000;
      transition: transform .05s, box-shadow .05s;
    }
    .px-btn:hover { background: #fff04d; }
    .px-btn:active {
      transform: translate(2px, 4px);
      box-shadow:
        inset 4px 4px 0 0 #b89a00,
        inset -4px -4px 0 0 #fff8c8,
        0 0 0 4px var(--c-black);
    }
    .px-btn.btn-cyan { background: var(--c-cyan); }
    .px-btn.btn-cyan:hover { background: #4ee0e0; }
    .px-btn.btn-dim {
      background: var(--c-bg-2);
      color: var(--c-purple);
      box-shadow:
        inset 4px 4px 0 0 var(--c-purple),
        inset -4px -4px 0 0 var(--c-frame-lo),
        0 0 0 4px var(--c-black),
        0 4px 0 0 #000;
    }
    .px-btn.btn-dim:hover { color: var(--c-cyan); }

    .refresh-info {
      font-family: var(--cn-font);
      font-size: 11px;
      color: var(--c-purple);
      letter-spacing: 1px;
      margin-bottom: 16px;
      min-height: 16px;
    }
    .error-msg {
      color: var(--c-red);
      font-family: var(--pixel-font);
      font-size: 10px;
      letter-spacing: 1px;
      margin-bottom: 12px;
      min-height: 14px;
    }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    /* Panel */
    .px-panel {
      background: var(--c-bg-2);
      box-shadow:
        inset 4px 4px 0 0 var(--c-purple),
        inset -4px -4px 0 0 var(--c-frame-lo),
        0 0 0 4px var(--c-black);
      padding: 18px 16px;
    }
    .panel-title {
      font-family: var(--pixel-font);
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--c-cyan);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title::before {
      content: '';
      display: inline-block;
      width: 8px; height: 8px;
      background: var(--c-yellow);
      box-shadow: 0 0 0 2px var(--c-black);
      animation: bulb-blink 1s steps(2) infinite;
    }
    @keyframes bulb-blink {
      0%, 50% { background: var(--c-yellow); }
      51%, 100% { background: var(--c-orange); opacity: 0.5; }
    }

    /* Summary big numbers */
    .summary-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-item { }
    .stat-label {
      font-family: var(--cn-font);
      font-size: 11px;
      color: var(--c-purple);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .stat-value {
      font-family: var(--pixel-font);
      font-size: 24px;
      color: var(--c-yellow);
      text-shadow: 2px 2px 0 var(--c-black);
    }
    .stat-value.green { color: var(--c-green); }
    .stat-value.cyan  { color: var(--c-cyan); }
    .stat-value.pink  { color: var(--c-pink); }

    /* Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--pixel-font);
      font-size: 11px;
    }
    th {
      color: var(--c-purple);
      text-align: right;
      padding: 7px 8px;
      border-bottom: 2px solid var(--c-frame-lo);
      letter-spacing: 1px;
    }
    th:first-child { text-align: left; }
    td {
      text-align: right;
      padding: 8px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.35);
      color: var(--c-white);
    }
    td:first-child { text-align: left; color: var(--c-yellow); }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(138,60,220,0.12); }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 10px;
      letter-spacing: 1px;
    }
    .badge-pending { background: var(--c-orange); color: var(--c-black); }
    .badge-done    { background: var(--c-green);  color: var(--c-black); }
    .badge-failed  { background: var(--c-red);    color: var(--c-white); }
    .badge-playing { background: var(--c-cyan);   color: var(--c-black); }
    .badge-won     { background: var(--c-yellow); color: var(--c-black); }
    .badge-lost    { background: var(--c-red);    color: var(--c-white); }
    .badge-cashout { background: var(--c-pink);   color: var(--c-black); }

    .empty { color: var(--c-purple); font-size: 9px; letter-spacing: 2px; padding: 10px 0; text-align: center; }

    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    @media (max-width: 600px) {
      .page-title { font-size: 13px; letter-spacing: 2px; }
      .stats-grid { grid-template-columns: 1fr; }
      .auth-row { flex-direction: column; align-items: stretch; }
      .px-input { width: 100%; font-size: 9px; }
      .px-btn { width: 100%; }
      .stat-value { font-size: 18px; }
      .px-panel { padding: 14px 10px; }
      table { font-size: 9px; }
      th, td { padding: 6px 5px; }
    }
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>

  <div class="container">
    <h1 class="page-title">ADMIN PANEL</h1>
    <p class="page-sub">实时中奖统计</p>

    <div class="auth-row">
      <input type="password" class="px-input" id="token" placeholder="TOKEN...">
      <button class="px-btn btn-cyan" onclick="load()">QUERY</button>
      <button class="px-btn" onclick="startAuto()">AUTO 10S</button>
      <button class="px-btn btn-dim" onclick="stopAuto()">STOP</button>
    </div>
    <div class="error-msg" id="err"></div>
    <div class="refresh-info" id="info"></div>

    <div id="content"></div>
  </div>

  <script src="activity-api.js"></script>
  <script src="admin-render.js"></script>
  <script>
    /* ---- starfield ---- */
    (function() {
      const cv = document.getElementById('starfield');
      const ctx = cv.getContext('2d');
      const palette = ['#e0254a','#2c54d6','#00d4d4','#f4d837','#8a3cdc','#ff8cb6','#4cc24f','#ff8e34'];
      let sq = [];
      function resize() {
        cv.width = innerWidth; cv.height = innerHeight;
        ctx.imageSmoothingEnabled = false;
        const n = Math.floor(innerWidth * innerHeight / 14000);
        sq = Array.from({length: n}, () => ({
          x: Math.random()*innerWidth, y: Math.random()*innerHeight,
          size: 2+Math.floor(Math.random()*3)*2, vy: 0.2+Math.random()*0.4,
          color: palette[Math.floor(Math.random()*palette.length)],
          phase: Math.random()*Math.PI*2,
        }));
      }
      window.addEventListener('resize', resize); resize();
      (function draw() {
        if (!document.hidden) {
          ctx.clearRect(0,0,cv.width,cv.height);
          for (const s of sq) {
            s.y += s.vy; s.phase += 0.04;
            if (s.y > cv.height+4) { s.y=-4; s.x=Math.random()*cv.width; }
            ctx.fillStyle = s.color;
            ctx.globalAlpha = 0.3+Math.abs(Math.sin(s.phase))*0.5;
            ctx.fillRect(Math.round(s.x), Math.round(s.y), s.size, s.size);
          }
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(draw);
      })();
    })();

    /* ---- admin logic ---- */
    let timer = null;
    let loadSeq = 0;

    function startAuto() {
      stopAuto();
      load();
      timer = setInterval(load, 10000);
      document.getElementById('info').textContent = '自动刷新中（每 10 秒）';
    }
    function stopAuto() {
      if (timer) { clearInterval(timer); timer = null; }
      document.getElementById('info').textContent = '';
    }

    async function load() {
      const seq = ++loadSeq;
      const tok = document.getElementById('token').value.trim();
      const errEl = document.getElementById('err');
      errEl.textContent = '';
      try {
        const r = await fetch('/api/admin/stats', {
          headers: { Authorization: 'Bearer ' + tok }
        });
        const data = await activityApi.readApiJson(r, {
          serverErrorMessage: '统计加载失败，请稍后重试',
          clientErrorMessage: '统计加载失败，请稍后重试',
        });
        if (seq !== loadSeq) return;
        render(data);
        const prefix = timer ? '自动刷新中（每 10 秒）— ' : '';
        document.getElementById('info').textContent = prefix + '最后更新：' + new Date().toLocaleTimeString('zh-CN');
      } catch(e) {
        if (seq !== loadSeq) return;
        errEl.textContent = activityApi.safeErrorMessage(e, '统计加载失败，请稍后重试');
      }
    }

    function render(d) {
      document.getElementById('content').innerHTML = adminRender.buildStatsGridHtml(d);
    }

    document.getElementById('token').addEventListener('keydown', e => {
      if (e.key === 'Enter') load();
    });
  </script>
</body>
</html>
