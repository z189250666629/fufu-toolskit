<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;400;600&family=Noto+Sans+SC:wght@300;400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --ink: #2e312a;
  --ink-light: #4d5245;
  --ink-faint: #7b8570;
  --paper: #f2f4ed;
  --paper-warm: #e9ece3;
  --paper-dark: #dde0d7;
  --accent-mute: #93a07e;
  --moss: #7b8570;
  --clay: #a8a48e;
  --stone: #93a07e;
  --card-hover-bg: rgba(255,255,255,.35);
  --ink-line-color: #4d5245;
}

[data-theme="dark"] {
  --ink: #e2e5dc;
  --ink-light: #c0c5b6;
  --ink-faint: #8a9180;
  --paper: #1a1d17;
  --paper-warm: #22261e;
  --paper-dark: #2e332a;
  --accent-mute: #93a07e;
  --moss: #8a9180;
  --clay: #7a7868;
  --stone: #93a07e;
  --card-hover-bg: rgba(255,255,255,.05);
  --ink-line-color: #8a9180;
}

body {
  min-height: 100vh;
  background: var(--paper);
  font-family: 'Noto Sans SC', sans-serif;
  color: var(--ink);
  line-height: 1.8;
  letter-spacing: .03em;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background-image:
    url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
}

.page {
  position: relative; z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 80px 32px 60px;
}

.header {
  text-align: center;
  margin-bottom: 72px;
}

.header-title {
  font-family: 'Noto Serif SC', serif;
  font-weight: 200;
  font-size: clamp(1.8rem, 5vw, 3rem);
  color: var(--ink);
  letter-spacing: .15em;
  margin-bottom: 20px;
}

.ink-line {
  display: block;
  margin: 0 auto 16px;
  width: min(280px, 60vw);
  height: 12px;
  opacity: .18;
}
.ink-line path { stroke: var(--ink-line-color); }

.header-sub {
  font-family: 'Noto Serif SC', serif;
  font-weight: 200;
  font-size: clamp(.8rem, 2vw, .95rem);
  color: var(--ink-faint);
  letter-spacing: .3em;
}

.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
}

.nav-card {
  position: relative;
  background: transparent;
  border: 1px solid var(--paper-dark);
  border-radius: 2px;
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .25s, background .25s;
  cursor: pointer;
}
.nav-card:hover {
  border-color: var(--ink-faint);
  background: var(--card-hover-bg);
}

.card-stamp {
  display: inline-flex;
  align-self: flex-start;
  padding: 3px 10px;
  border: 1.5px solid var(--accent, var(--stone));
  border-radius: 1px;
  font-family: 'Noto Serif SC', serif;
  font-size: .65rem;
  font-weight: 600;
  color: var(--accent, var(--stone));
  letter-spacing: .12em;
  transform: rotate(-1.5deg);
  opacity: .7;
}

.card-title {
  font-family: 'Noto Serif SC', serif;
  font-weight: 400;
  font-size: 1.15rem;
  color: var(--ink);
  letter-spacing: .08em;
  margin-top: 4px;
}

.card-desc {
  font-size: .82rem;
  font-weight: 300;
  color: var(--ink-faint);
  line-height: 1.7;
}

.card-links {
  display: flex; flex-direction: column; gap: 4px;
  margin-top: 6px;
}
.card-links a {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--paper-dark);
  color: var(--ink-light);
  text-decoration: none;
  font-size: .8rem;
  font-weight: 300;
  letter-spacing: .05em;
  transition: color .25s, border-color .25s;
}
.card-links a:hover {
  color: var(--ink);
  border-color: var(--ink-faint);
}
.card-links a .latency {
  margin-left: auto;
  font-size: .7rem;
  color: var(--ink-faint);
  opacity: .6;
  min-width: 42px;
  text-align: right;
}
.card-links a .latency.good { color: var(--moss); opacity: .8; }
.card-links a .latency.slow { color: #b08a5e; opacity: .8; }
.card-links a .latency.bad { color: #a06050; opacity: .8; }
.card-links a .arrow {
  font-size: .7rem;
  opacity: .3;
  transition: opacity .25s;
}
.card-links a:hover .arrow { opacity: .7; }

.card-enter {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: auto; padding-top: 10px;
  color: var(--ink-faint);
  text-decoration: none;
  font-family: 'Noto Serif SC', serif;
  font-size: .78rem;
  font-weight: 400;
  letter-spacing: .15em;
  transition: color .25s;
}
.card-enter:hover { color: var(--ink); }

/* 主题切换按钮 */
.theme-toggle {
  position: fixed;
  top: 24px; right: 24px;
  z-index: 10;
  width: 36px; height: 36px;
  border: 1px solid var(--paper-dark);
  border-radius: 50%;
  background: var(--paper-warm);
  color: var(--ink-faint);
  font-size: .9rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .25s, background .25s, color .25s;
  line-height: 1;
}
.theme-toggle:hover {
  border-color: var(--ink-faint);
  color: var(--ink);
}

.fade-in {
  opacity: 0;
  transform: translateY(8px);
  animation: fadeUp .5s ease forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="切换深色模式">
  <span id="themeIcon">☽</span>
</button>

<div class="page">

  <header class="header fade-in">
    <svg class="ink-line" viewBox="0 0 280 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 7 Q30 3, 70 6 T140 5 T210 7 T280 4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M20 9 Q80 4, 140 8 T260 5" stroke-width=".6" stroke-linecap="round" fill="none" opacity=".5"/>
    </svg>
    <h1 class="header-title">fufu 导 航</h1>
    <svg class="ink-line" viewBox="0 0 280 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 5 Q40 8, 90 4 T180 7 T280 5" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </svg>
    <p class="header-sub">择 路 而 往</p>
  </header>

  <div class="nav-grid">

    <div class="nav-card fade-in" style="animation-delay:.1s; --accent: var(--clay);">
      <span class="card-stamp">次数</span>
      <div class="card-title">API 次数站</div>
      <div class="card-links">
        <a href="https://api.fufuapi.top" data-ping="https://api.fufuapi.top"><span>线路 一</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://api.fufuapi.online" data-ping="https://api.fufuapi.online"><span>线路 二</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://api.fufuflower.top" data-ping="https://api.fufuflower.top"><span>线路 三</span><span class="latency">--</span><span class="arrow">›</span></a>
      </div>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.15s; --accent: var(--moss);">
      <span class="card-stamp">额度</span>
      <div class="card-title">Token 站</div>
      <div class="card-links">
        <a href="https://token.fufuapi.top" data-ping="https://token.fufuapi.top"><span>线路 一</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://token.fufuapi.online" data-ping="https://token.fufuapi.online"><span>线路 二</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://token.fufuflower.top" data-ping="https://token.fufuflower.top"><span>线路 三</span><span class="latency">--</span><span class="arrow">›</span></a>
      </div>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.2s; --accent: var(--stone);" data-href="https://build.fufuapi.online">
      <span class="card-stamp">造物</span>
      <div class="card-title">Build</div>
      <div class="card-desc">AI 画图生成</div>
      <a href="https://build.fufuapi.online" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.25s; --accent: var(--clay);" data-href="https://compact.if.tc">
      <span class="card-stamp">合卡</span>
      <div class="card-title">Compact</div>
      <div class="card-desc">自助合卡工具</div>
      <a href="https://compact.if.tc" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.3s; --accent: var(--moss);" data-href="https://nd.if.tc">
      <span class="card-stamp">测速</span>
      <div class="card-title">网络测试</div>
      <div class="card-desc">连通性检测与模型测试</div>
      <a href="https://nd.if.tc" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.35s; --accent: var(--stone);" data-href="https://activity.if.tc">
      <span class="card-stamp">活动</span>
      <div class="card-title">活动中心</div>
      <div class="card-desc">最新活动与福利</div>
      <a href="https://activity.if.tc" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.4s; --accent: var(--clay);" data-href="https://idc.fufuapi.top">
      <span class="card-stamp">服务器</span>
      <div class="card-title">FufuIDC</div>
      <div class="card-desc">IDC 服务器管理</div>
      <a href="https://idc.fufuapi.top" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card fade-in" style="animation-delay:.45s; --accent: var(--moss);">
      <span class="card-stamp">终端</span>
      <div class="card-title">Web Terminal</div>
      <div class="card-desc">服务器网页管理终端</div>
      <div class="card-links">
        <a href="https://terminal.fufuapi.top" data-ping="https://terminal.fufuapi.top"><span>线路 一</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://terminal.if.tc" data-ping="https://terminal.if.tc"><span>线路 二</span><span class="latency">--</span><span class="arrow">›</span></a>
      </div>
    </div>

  </div>

</div>

<script type="module">
import { initTheme } from './theme.mjs';

initTheme();
</script>
<script>
(function() {
  document.querySelectorAll('a[data-ping]').forEach(function(a) {
    var url = a.getAttribute('data-ping');
    var el = a.querySelector('.latency');
    var t0 = performance.now();
    fetch(url, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' })
      .then(function() {
        var ms = Math.round(performance.now() - t0);
        el.textContent = ms + 'ms';
        if (ms < 200) el.className = 'latency good';
        else if (ms < 500) el.className = 'latency slow';
        else el.className = 'latency bad';
      })
      .catch(function() {
        el.textContent = '超时';
        el.className = 'latency bad';
      });
  });
  document.querySelectorAll('.nav-card[data-href]').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('a')) return;
      window.open(card.getAttribute('data-href'), '_blank');
    });
  });
})();
</script>
</body>
</html>
