<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>fufu 工具站</title>
<link rel="stylesheet" href="./nav-ui-tokens.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  min-height: 100vh;
  background: var(--fufu-nav-bg);
  font-family: var(--font-family-ui);
  color: var(--fufu-nav-fg);
  line-height: 1.8;
  letter-spacing: .03em;
  overflow-x: hidden;
  transition: background .3s, color .3s;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  background-image:
    url("data:image/svg+xml,%3Csvg width='200' height='200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");
}

.page {
  position: relative; z-index: 1;
  max-width: 820px;
  margin: 0 auto;
  padding: 80px 32px 60px;
}

.header {
  text-align: center;
  margin-bottom: 72px;
}

.header-title {
  font-family: var(--font-family-display);
  font-weight: 200;
  font-size: clamp(1.8rem, 5vw, 3rem);
  color: var(--fufu-nav-fg);
  letter-spacing: .15em;
  margin-bottom: 20px;
}

.ink-line {
  display: block;
  margin: 0 auto 16px;
  width: min(280px, 60vw);
  height: 12px;
  opacity: .18;
}
.ink-line path { stroke: var(--fufu-nav-ink-line-color); }

.header-sub {
  font-family: var(--font-family-display);
  font-weight: 200;
  font-size: clamp(.8rem, 2vw, .95rem);
  color: var(--fufu-nav-fg-muted);
  letter-spacing: .3em;
}

.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 20px;
}

.nav-card {
  position: relative;
  background: transparent;
  border: 1px solid var(--fufu-nav-border);
  border-radius: 2px;
  padding: 32px 28px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .25s, background .25s;
  cursor: pointer;
}
.nav-card:hover {
  border-color: var(--fufu-nav-fg-muted);
  background: var(--fufu-nav-card-hover-bg);
}

.card-stamp {
  display: inline-flex;
  align-self: flex-start;
  padding: 3px 10px;
  border: 1.5px solid var(--accent, var(--stone));
  border-radius: 1px;
  font-family: var(--font-family-display);
  font-size: .65rem;
  font-weight: 600;
  color: var(--accent, var(--stone));
  letter-spacing: .12em;
  transform: rotate(-1.5deg);
  opacity: .7;
}

.card-title {
  font-family: var(--font-family-display);
  font-weight: 400;
  font-size: 1.15rem;
  color: var(--fufu-nav-fg);
  letter-spacing: .08em;
  margin-top: 4px;
}

.card-desc {
  font-size: .82rem;
  font-weight: 300;
  color: var(--fufu-nav-fg-muted);
  line-height: 1.7;
}

.card-links {
  display: flex; flex-direction: column; gap: 4px;
  margin-top: 6px;
}
.card-links a {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 12px;
  border-bottom: 1px solid var(--fufu-nav-border);
  color: var(--fufu-nav-fg-soft);
  text-decoration: none;
  font-size: .8rem;
  font-weight: 300;
  letter-spacing: .05em;
  transition: color .25s, border-color .25s;
}
.card-links a:hover {
  color: var(--fufu-nav-fg);
  border-color: var(--fufu-nav-fg-muted);
}
.card-links a .latency {
  margin-left: auto;
  font-size: .7rem;
  color: var(--fufu-nav-fg-muted);
  opacity: .6;
  min-width: 42px;
  text-align: right;
}
.card-links a .latency.good { color: var(--moss); opacity: .8; }
.card-links a .latency.slow { color: #b08a5e; opacity: .8; }
.card-links a .latency.bad { color: #a06050; opacity: .8; }
.card-links a .arrow {
  font-size: .7rem;
  opacity: .3;
  transition: opacity .25s;
}
.card-links a:hover .arrow { opacity: .7; }

.card-enter {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: auto; padding-top: 10px;
  color: var(--fufu-nav-fg-muted);
  text-decoration: none;
  font-family: var(--font-family-display);
  font-size: .78rem;
  font-weight: 400;
  letter-spacing: .15em;
  transition: color .25s;
}
.card-enter:hover { color: var(--fufu-nav-fg); }

.top-actions {
  position: fixed;
  top: 24px; right: 24px;
  z-index: 10;
  display: flex;
  align-items: center;
  gap: 10px;
}

.admin-entry {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 36px;
  padding: 0 14px;
  border: 1px solid var(--fufu-nav-border);
  border-radius: 999px;
  background: color-mix(in srgb, var(--fufu-nav-surface-muted) 86%, transparent);
  color: var(--fufu-nav-fg-soft);
  text-decoration: none;
  font-family: var(--font-family-display);
  font-size: .76rem;
  font-weight: 400;
  letter-spacing: .12em;
  backdrop-filter: blur(8px);
  transition: border-color .25s, background .25s, color .25s, transform .25s;
}
.admin-entry:hover {
  border-color: var(--fufu-nav-fg-muted);
  background: var(--fufu-nav-surface-muted);
  color: var(--fufu-nav-fg);
  transform: translateY(-1px);
}

.theme-toggle {
  width: 36px; height: 36px;
  border: 1px solid var(--fufu-nav-border);
  border-radius: 50%;
  background: var(--fufu-nav-surface-muted);
  color: var(--fufu-nav-fg-muted);
  font-size: .9rem;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .25s, background .25s, color .25s;
  line-height: 1;
}
.theme-toggle:hover {
  border-color: var(--fufu-nav-fg-muted);
  color: var(--fufu-nav-fg);
}

@media (max-width: 520px) {
  .top-actions { top: 16px; right: 16px; gap: 8px; }
  .admin-entry { min-height: 34px; padding: 0 11px; font-size: .7rem; }
  .theme-toggle { width: 34px; height: 34px; }
}

.fade-in {
  opacity: 0;
  transform: translateY(8px);
  animation: fadeUp .5s ease forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="top-actions" aria-label="快捷入口">
  <button class="theme-toggle" id="themeToggle" data-slot="button" aria-label="切换深色模式">
    <span id="themeIcon">☽</span>
  </button>
  <a href="/admin" class="admin-entry" data-slot="button" aria-label="进入管理后台">管理后台</a>
</div>

<div class="page">

  <header class="header fade-in">
    <svg class="ink-line" viewBox="0 0 280 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 7 Q30 3, 70 6 T140 5 T210 7 T280 4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <path d="M20 9 Q80 4, 140 8 T260 5" stroke-width=".6" stroke-linecap="round" fill="none" opacity=".5"/>
    </svg>
    <h1 class="header-title">fufu 工 具 站</h1>
    <svg class="ink-line" viewBox="0 0 280 12" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 5 Q40 8, 90 4 T180 7 T280 5" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </svg>
    <p class="header-sub">导 航 · 状 态 · 合 卡 · 活 动</p>
  </header>

  <div class="nav-grid">

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.1s; --accent: var(--clay);">
      <span class="card-stamp">次数</span>
      <div class="card-title">API 次数站</div>
      <div class="card-links">
        <a href="https://api.fufuapi.top" data-ping="https://api.fufuapi.top"><span>线路 一</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://api.fufuapi.online" data-ping="https://api.fufuapi.online"><span>线路 二</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://api.fufuflower.top" data-ping="https://api.fufuflower.top"><span>线路 三</span><span class="latency">--</span><span class="arrow">›</span></a>
      </div>
    </div>

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.15s; --accent: var(--moss);">
      <span class="card-stamp">额度</span>
      <div class="card-title">Token 站</div>
      <div class="card-links">
        <a href="https://token.fufuapi.top" data-ping="https://token.fufuapi.top"><span>线路 一</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://token.fufuapi.online" data-ping="https://token.fufuapi.online"><span>线路 二</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://token.fufuflower.top" data-ping="https://token.fufuflower.top"><span>线路 三</span><span class="latency">--</span><span class="arrow">›</span></a>
      </div>
    </div>

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.2s; --accent: var(--stone);" data-href="https://build.fufuapi.online">
      <span class="card-stamp">造物</span>
      <div class="card-title">Build</div>
      <div class="card-desc">AI 画图生成</div>
      <a href="https://build.fufuapi.online" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.25s; --accent: var(--moss);" data-href="/status">
      <span class="card-stamp">状态</span>
      <div class="card-title">API / 模型状态</div>
      <div class="card-desc">连通性检测、模型可用性与手动测试</div>
      <a href="/status" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.3s; --accent: var(--clay);" data-href="/combine">
      <span class="card-stamp">合卡</span>
      <div class="card-title">合卡工具</div>
      <div class="card-desc">自助合并额度卡，复用统一 NewAPI 配置</div>
      <a href="/combine" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.35s; --accent: var(--stone);" data-href="/activity">
      <span class="card-stamp">活动</span>
      <div class="card-title">活动前台</div>
      <div class="card-desc">抽奖、刮刮卡与福利入口</div>
      <a href="/activity" class="card-enter">进入 ›</a>
    </div>

    <div class="nav-card card fade-in" data-slot="card" style="animation-delay:.4s; --accent: var(--moss);">
      <span class="card-stamp">终端</span>
      <div class="card-title">Web Terminal</div>
      <div class="card-desc">服务器网页管理终端</div>
      <div class="card-links">
        <a href="https://terminal.fufuapi.top" data-ping="https://terminal.fufuapi.top"><span>线路 一</span><span class="latency">--</span><span class="arrow">›</span></a>
        <a href="https://terminal.if.tc" data-ping="https://terminal.if.tc"><span>线路 二</span><span class="latency">--</span><span class="arrow">›</span></a>
      </div>
    </div>

  </div>

</div>

<script type="module">
import { initTheme } from './theme.mjs';
import { initLatencyProbes } from './latency.mjs';

initTheme();
initLatencyProbes();
</script>
<script>
(function() {
  document.querySelectorAll('.nav-card[data-href]').forEach(function(card) {
    card.addEventListener('click', function(e) {
      if (e.target.closest('a')) return;
      window.open(card.getAttribute('data-href'), '_blank');
    });
  });
})();
</script>
</body>
</html>
