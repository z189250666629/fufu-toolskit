stages:
  - verify
  - image
  - deploy

default:
  interruptible: true

variables:
  # Keep CI and runtime aligned with the existing Dockerfile.
  DEFAULT_BASE_IMAGE: node:22-alpine
  DOCKER_IMAGE: docker:27-cli
  DIND_IMAGE: docker:27-dind

  # Docker-in-Docker defaults for GitLab runners.
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

  # Deployment defaults. Override these in GitLab CI/CD variables when needed.
  APP_IMAGE: $CI_REGISTRY_IMAGE
  DEPLOY_PATH: /data/docker/network-detact
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_SERVICE_NAME: network-detact
  CONTAINER_NAME: network-detact
  HOST_PORT: "8080"

workflow:
  rules:
    # Always create an MR pipeline when the event source is a merge request.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Skip duplicate branch pipelines when an MR already exists for the branch.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

verify:
  stage: verify
  image: node:22-alpine
  script:
    - test -f package.json
    - test -f backend/server.js
    - test -f frontend/index.html
    - test -f frontend/app.js
    - test -f frontend/styles.css
    - test -f newapi-managed-api-sites.example.json
    - test -f Dockerfile
    - test -f docker-compose.yml
    - grep -q "/api/newapi/overview" frontend/app.js
    - grep -q "modelAvailability" backend/server.js
    - grep -q "node:22-alpine" Dockerfile
    - npm test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

build_image:
  stage: image
  image: $DOCKER_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
      entrypoint: ["sh", "-c"]
      command:
        - |
          set -eu
          mirror_args=""
          if [ -n "${REGISTRY_MIRRORS:-}" ]; then
            OLDIFS="$IFS"
            IFS=','
            for m in $REGISTRY_MIRRORS; do
              m="$(printf '%s' "$m" | xargs)"
              [ -n "$m" ] && mirror_args="$mirror_args --registry-mirror=$m"
            done
            IFS="$OLDIFS"
          fi
          exec dockerd-entrypoint.sh --tls=false --host=tcp://0.0.0.0:2375 $mirror_args
  needs:
    - verify
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -eu

      IMAGE_NAME="${APP_IMAGE:-$CI_REGISTRY_IMAGE}"
      IMAGE_TAG="${APP_TAG:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}}"

      timeout=60
      until docker info >/dev/null 2>&1; do
        timeout=$((timeout - 1))
        if [ "$timeout" -le 0 ]; then
          echo "ERROR: docker daemon (dind service) did not become ready within 60s." >&2
          echo "HINT: check runner privileged mode, docker service networking, and daemon logs." >&2
          exit 1
        fi
        sleep 1
      done

      BASE_IMAGE_EFFECTIVE="${BASE_IMAGE:-${DEFAULT_BASE_IMAGE:-node:22-alpine}}"

      # If direct Docker Hub access is slow or blocked, try configured mirror hosts as image prefixes.
      if [ -z "${BASE_IMAGE:-}" ] && [ -n "${REGISTRY_MIRRORS:-}" ]; then
        BASE_IMAGE_ORIG="$BASE_IMAGE_EFFECTIVE"
        OLDIFS="$IFS"
        IFS=','
        for m in $REGISTRY_MIRRORS; do
          m="$(printf '%s' "$m" | xargs)"
          [ -z "$m" ] && continue

          host="$(printf '%s' "$m" | sed -e 's#^https://##' -e 's#^http://##' -e 's#/*$##')"
          [ -z "$host" ] && continue

          if printf '%s' "$BASE_IMAGE_ORIG" | grep -q '/'; then
            candidate="$host/$BASE_IMAGE_ORIG"
          else
            candidate="$host/library/$BASE_IMAGE_ORIG"
          fi

          echo "Trying BASE_IMAGE mirror: $candidate"
          if docker pull "$candidate" >/dev/null 2>&1; then
            BASE_IMAGE_EFFECTIVE="$candidate"
            break
          fi
        done
        IFS="$OLDIFS"
      fi

      echo "Using BASE_IMAGE=$BASE_IMAGE_EFFECTIVE"
      docker build --pull --build-arg BASE_IMAGE="$BASE_IMAGE_EFFECTIVE" -t "$IMAGE_NAME:$IMAGE_TAG" .
      docker push "$IMAGE_NAME:$IMAGE_TAG"

      # Keep a moving tag for the most recent release tag.
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "$IMAGE_TAG" != "latest" ]; then
        docker tag "$IMAGE_NAME:$IMAGE_TAG" "$IMAGE_NAME:latest"
        docker push "$IMAGE_NAME:latest"
      fi
  rules:
    - if: $CI_COMMIT_TAG

deploy_production:
  stage: deploy
  image: alpine:3.20
  needs:
    - build_image
  environment:
    name: production
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - |
      set -eu
      if [ -n "${SSH_PRIVATE_KEY_B64:-}" ]; then
        printf '%s' "$SSH_PRIVATE_KEY_B64" | base64 -d | tr -d '\r' > ~/.ssh/id_ed25519
      elif [ -z "${SSH_PRIVATE_KEY:-}" ]; then
        echo "ERROR: SSH_PRIVATE_KEY or SSH_PRIVATE_KEY_B64 must be set." >&2
        exit 1
      elif [ -f "${SSH_PRIVATE_KEY:-}" ]; then
        tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
      else
        printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - |
      set -eu
      if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
        echo "ERROR: SSH private key is not valid. Check SSH_PRIVATE_KEY / SSH_PRIVATE_KEY_B64, verify that you used the private key instead of the .pub file, and avoid broken line endings." >&2
        exit 1
      fi
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - |
      set -eu

      : "${SSH_HOST:?SSH_HOST is required}"
      : "${SSH_USER:?SSH_USER is required}"
      : "${DEPLOY_PATH:?DEPLOY_PATH is required}"

      APP_IMAGE_VALUE="${APP_IMAGE:-$CI_REGISTRY_IMAGE}"
      APP_TAG_VALUE="${APP_TAG:-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}}"
      REGISTRY_USER_VALUE="${DEPLOY_REGISTRY_USER:-$CI_REGISTRY_USER}"
      REGISTRY_PASSWORD_VALUE="${DEPLOY_REGISTRY_PASSWORD:-$CI_REGISTRY_PASSWORD}"
      LOCAL_COMPOSE_FILE="${COMPOSE_FILE:-docker-compose.yml}"
      REMOTE_COMPOSE_FILE="$(basename "$LOCAL_COMPOSE_FILE")"
      SERVICE_NAME="${COMPOSE_SERVICE_NAME:-network-detact}"
      SSH_PORT_VALUE="${SSH_PORT:-22}"
      SSH_TARGET="$SSH_USER@$SSH_HOST"
      SSH_OPTS="-i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"

      cat > .deploy.env <<EOF
      APP_IMAGE=$APP_IMAGE_VALUE
      APP_TAG=$APP_TAG_VALUE
      CONTAINER_NAME=${CONTAINER_NAME:-network-detact}
      HOST_PORT=${HOST_PORT:-8080}
      NEWAPI_MANAGED_API_SITES=${NEWAPI_MANAGED_API_SITES:-}
      NEWAPI_MANAGED_API_CONFIG=${NEWAPI_MANAGED_API_CONFIG:-}
      NEWAPI_API_SITE_TOKEN=${NEWAPI_API_SITE_TOKEN:-}
      NEWAPI_TOKEN_SITE_TOKEN=${NEWAPI_TOKEN_SITE_TOKEN:-}
      NEWAPI_API_SITE_URL=${NEWAPI_API_SITE_URL:-}
      NEWAPI_TOKEN_SITE_URL=${NEWAPI_TOKEN_SITE_URL:-}
      CONNECTIVITY_API_URLS=${CONNECTIVITY_API_URLS:-}
      CONNECTIVITY_TOKEN_URLS=${CONNECTIVITY_TOKEN_URLS:-}
      EOF

      # Always upload the compose file so the remote host does not depend on manual drift.
      ssh $SSH_OPTS -p "$SSH_PORT_VALUE" "$SSH_TARGET" "mkdir -p '$DEPLOY_PATH'"
      scp $SSH_OPTS -P "$SSH_PORT_VALUE" "$LOCAL_COMPOSE_FILE" "$SSH_TARGET:$DEPLOY_PATH/$REMOTE_COMPOSE_FILE"
      scp $SSH_OPTS -P "$SSH_PORT_VALUE" .deploy.env "$SSH_TARGET:$DEPLOY_PATH/.env"

      # Use a long-lived deploy token if provided; otherwise fall back to the job token.
      printf '%s' "$REGISTRY_PASSWORD_VALUE" | ssh $SSH_OPTS -p "$SSH_PORT_VALUE" "$SSH_TARGET" \
        "docker login '$CI_REGISTRY' -u '$REGISTRY_USER_VALUE' --password-stdin"

      ssh $SSH_OPTS -p "$SSH_PORT_VALUE" "$SSH_TARGET" "
        set -eu
        cd '$DEPLOY_PATH'
        docker compose --env-file .env -f '$REMOTE_COMPOSE_FILE' pull
        docker compose --env-file .env -f '$REMOTE_COMPOSE_FILE' up -d
        docker compose --env-file .env -f '$REMOTE_COMPOSE_FILE' ps

        CID=\$(docker compose --env-file .env -f '$REMOTE_COMPOSE_FILE' ps -q '$SERVICE_NAME')
        [ -n \"\$CID\" ]

        i=0
        while [ \$i -lt 30 ]; do
          STATUS=\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \"\$CID\")
          echo \"container status: \$STATUS\"
          if [ \"\$STATUS\" = 'healthy' ]; then
            exit 0
          fi
          i=\$((i + 1))
          sleep 5
        done

        docker compose --env-file .env -f '$REMOTE_COMPOSE_FILE' logs --tail=200
        docker inspect \"\$CID\"
        exit 1
      "
  rules:
    - if: $CI_COMMIT_TAG
      when: on_success
