name: CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  DEFAULT_BASE_IMAGE: node:22-alpine
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check required files and fixed targets
        shell: bash
        run: |
          set -euo pipefail

          test -f package.json
          test -f backend/server.js
          test -f frontend/index.html
          test -f frontend/app.js
          test -f frontend/styles.css
          test -f Dockerfile
          test -f docker-compose.yml

          grep -q "api.fufuapi.top" backend/server.js
          grep -q "api.fufuapi.online" backend/server.js
          grep -q "api.fufuflower.top" backend/server.js
          grep -q "token.fufuapi.top" backend/server.js
          grep -q "token.fufuapi.online" backend/server.js
          grep -q "token.fufuflower.top" backend/server.js
          grep -q "node:22-alpine" Dockerfile
          grep -q "/api/health" Dockerfile

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Run syntax checks
        run: npm test

  docker:
    name: Package Docker image
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ vars.BASE_IMAGE || env.DEFAULT_BASE_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: docker
    environment: docker
    if: ${{ startsWith(github.ref, 'refs/tags/') }}

    env:
      DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED || 'false' }}
      SSH_HOST: ${{ vars.SSH_HOST || vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.SSH_USER || vars.DEPLOY_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/data/docker/network-detact' }}
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      APP_IMAGE: ${{ vars.APP_IMAGE || format('ghcr.io/{0}', github.repository) }}
      APP_TAG: ${{ vars.APP_TAG || github.ref_name }}
      REGISTRY_USER: ${{ vars.REGISTRY_USER || secrets.REGISTRY_USER || secrets.GHCR_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN }}
      COMPOSE_FILE: ${{ vars.COMPOSE_FILE || 'docker-compose.yml' }}
      COMPOSE_SERVICE_NAME: ${{ vars.COMPOSE_SERVICE_NAME || 'network-detact' }}
      CONTAINER_NAME: ${{ vars.CONTAINER_NAME || vars.DEPLOY_CONTAINER || 'network-detact' }}
      HOST_BIND: ${{ vars.HOST_BIND || '0.0.0.0' }}
      HOST_PORT: ${{ vars.HOST_PORT || vars.DEPLOY_APP_PORT || '8080' }}
      NEWAPI_API_SITE_TOKEN: ${{ secrets.NEWAPI_API_SITE_TOKEN }}
      NEWAPI_TOKEN_SITE_TOKEN: ${{ secrets.NEWAPI_TOKEN_SITE_TOKEN }}
      NEWAPI_API_SITE_URL: ${{ vars.NEWAPI_API_SITE_URL || '' }}
      NEWAPI_TOKEN_SITE_URL: ${{ vars.NEWAPI_TOKEN_SITE_URL || '' }}
      CONNECTIVITY_API_URLS: ${{ vars.CONNECTIVITY_API_URLS || '' }}
      CONNECTIVITY_TOKEN_URLS: ${{ vars.CONNECTIVITY_TOKEN_URLS || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy with docker compose
        run: |
          if [ "$DEPLOY_ENABLED" != "true" ]; then
            echo "DEPLOY_ENABLED is not true; skipping deploy."
            exit 0
          fi
          sh scripts/deploy-docker.sh
