name: deploy-network

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-network
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check directive + pre-release filter
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate check
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"

          if [[ "$TAG" == *-* ]]; then
            echo "Skipping pre-release tag: $TAG"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --format=%B "${{ github.sha }}")
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qiE '\[(deploy all|deploy network|deploy network-detect|deploy network_detect)\]'; then
            echo "Deploy directive found"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No network deploy directive; skipping"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify network-detect
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/network-detect/package.json

      - name: Syntax check
        run: npm run test:network

  docker:
    name: Build + push network-detect image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-network-detect
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/network-detect
          push: true
          build-args: |
            BASE_IMAGE=${{ vars.NETWORK_DETECT_BASE_IMAGE || 'node:22-alpine' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=network-detect
          cache-to: type=gha,mode=max,scope=network-detect

  deploy:
    name: Deploy network-detect
    needs: docker
    runs-on: ubuntu-latest
    environment: docker
    env:
      APP_NAME: network-detect
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-network-detect
      APP_TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN || github.token }}
      SSH_HOST: ${{ vars.SSH_HOST || vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.SSH_USER || vars.DEPLOY_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.NETWORK_DETECT_DEPLOY_PATH || '/data/docker/network-detect' }}
      COMPOSE_FILE: infra/deploy/network-detect/docker-compose.yml
      COMPOSE_SERVICE_NAME: network-detact
      CONTAINER_NAME: ${{ vars.NETWORK_DETECT_CONTAINER_NAME || 'network-detact' }}
      HOST_BIND: ${{ vars.NETWORK_DETECT_HOST_BIND || vars.HOST_BIND || '0.0.0.0' }}
      HOST_PORT: ${{ vars.NETWORK_DETECT_HOST_PORT || '38473' }}
      NEWAPI_MANAGED_API_SITES: ${{ secrets.NEWAPI_MANAGED_API_SITES || vars.NEWAPI_MANAGED_API_SITES }}
      NEWAPI_MANAGED_API_CONFIG: ${{ vars.NEWAPI_MANAGED_API_CONFIG }}
      NEWAPI_API_SITE_TOKEN: ${{ secrets.NEWAPI_API_SITE_TOKEN }}
      NEWAPI_TOKEN_SITE_TOKEN: ${{ secrets.NEWAPI_TOKEN_SITE_TOKEN }}
      NEWAPI_API_SITE_URL: ${{ vars.NEWAPI_API_SITE_URL }}
      NEWAPI_TOKEN_SITE_URL: ${{ vars.NEWAPI_TOKEN_SITE_URL }}
      CONNECTIVITY_API_URLS: ${{ vars.CONNECTIVITY_API_URLS }}
      CONNECTIVITY_TOKEN_URLS: ${{ vars.CONNECTIVITY_TOKEN_URLS }}
      NEWAPI_DASHBOARD_VIEW_KEY: ${{ secrets.NEWAPI_DASHBOARD_VIEW_KEY || vars.NEWAPI_DASHBOARD_VIEW_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with docker compose
        shell: bash
        run: bash scripts/deploy-docker-app.sh
