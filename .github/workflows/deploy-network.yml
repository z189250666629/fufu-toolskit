name: deploy-network

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-network
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: gate
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-* ]]; then echo "should_deploy=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          MSG=$(git log -1 --format=%B "${{ github.sha }}")
          if echo "$MSG" | grep -qiE '\[(deploy all|deploy network|deploy network-detect|deploy network_detect|deploy combine)\]'; then echo "should_deploy=true" >> "$GITHUB_OUTPUT"; else echo "should_deploy=false" >> "$GITHUB_OUTPUT"; fi
  verify:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/network-detect/go.mod
          cache-dependency-path: |
            apps/network-detect/go.sum
            packages/go/fufu/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: go test -count=1 ./...
      - run: npm run test:scripts
      - run: npm --prefix apps/network-detect run test:frontend
  docker:
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-network-detect
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/network-detect/Dockerfile
          push: true
          build-args: |
            GO_IMAGE=${{ vars.NETWORK_DETECT_GO_IMAGE || 'golang:1.25-alpine' }}
            RUNTIME_IMAGE=${{ vars.NETWORK_DETECT_RUNTIME_IMAGE || 'alpine:3.22' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=network-detect
          cache-to: type=gha,mode=max,scope=network-detect
  deploy:
    needs: docker
    runs-on: ubuntu-latest
    environment: toolskit
    env:
      APP_NAME: network-detect
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-network-detect
      APP_TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ vars.REGISTRY_USER || secrets.GHCR_USERNAME || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN || github.token }}
      SSH_HOST: ${{ vars.SSH_HOST || vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.SSH_USER || vars.DEPLOY_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.NETWORK_DETECT_DEPLOY_PATH || vars.DETECT_DEPLOY_PATH || vars.DEPLOY_PATH && format('{0}/network-detect', vars.DEPLOY_PATH) || '/data/docker/network-detect' }}
      COMPOSE_FILE: infra/deploy/network-detect/docker-compose.yml
      COMPOSE_SERVICE_NAME: network-detect
      CONTAINER_NAME: ${{ vars.NETWORK_DETECT_CONTAINER_NAME || 'network-detect' }}
      HOST_BIND: ${{ vars.NETWORK_DETECT_HOST_BIND || vars.HOST_BIND || '0.0.0.0' }}
      HOST_PORT: ${{ vars.NETWORK_DETECT_HOST_PORT || vars.DETECT_PORT || '38473' }}
      NEWAPI_MANAGED_API_SITES: ${{ secrets.NEWAPI_MANAGED_API_SITES || vars.NEWAPI_MANAGED_API_SITES }}
      NEWAPI_MANAGED_API_CONFIG: ${{ vars.NEWAPI_MANAGED_API_CONFIG }}
      NEWAPI_API_SITE_TOKEN: ${{ secrets.NEWAPI_API_SITE_TOKEN }}
      NEWAPI_TOKEN_SITE_TOKEN: ${{ secrets.NEWAPI_TOKEN_SITE_TOKEN }}
      NEWAPI_API_SITE_URL: ${{ vars.NEWAPI_API_SITE_URL }}
      NEWAPI_TOKEN_SITE_URL: ${{ vars.NEWAPI_TOKEN_SITE_URL }}
      CONNECTIVITY_API_URLS: ${{ vars.CONNECTIVITY_API_URLS }}
      CONNECTIVITY_TOKEN_URLS: ${{ vars.CONNECTIVITY_TOKEN_URLS }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: bash scripts/deploy-docker-app.sh
