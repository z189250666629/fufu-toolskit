name: deploy-y2k-nav

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-y2k-nav
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check directive + pre-release filter
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate check
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"

          if [[ "$TAG" == *-* ]]; then
            echo "Skipping pre-release tag: $TAG"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --format=%B "${{ github.sha }}")
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qiE '\[(deploy all|deploy y2k|deploy y2k-nav|deploy nav|deploy navigation)\]'; then
            echo "Deploy directive found"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No y2k-nav deploy directive; skipping"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify y2k-nav
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check static page
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/y2k-nav/index.html
          grep -qi '<!DOCTYPE html>' apps/y2k-nav/index.html

  docker:
    name: Build + push y2k-nav image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-y2k-nav
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/y2k-nav
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=y2k-nav
          cache-to: type=gha,mode=max,scope=y2k-nav

  deploy:
    name: Deploy y2k-nav
    needs: docker
    runs-on: ubuntu-latest
    environment: toolskit
    env:
      APP_NAME: y2k-nav
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-y2k-nav
      APP_TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ vars.REGISTRY_USER || secrets.GHCR_USERNAME || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN || github.token }}
      SSH_HOST: ${{ vars.SSH_HOST || vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.SSH_USER || vars.DEPLOY_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.Y2K_NAV_DEPLOY_PATH || vars.DEPLOY_PATH && format('{0}/y2k-nav', vars.DEPLOY_PATH) || '/data/docker/y2k-nav' }}
      COMPOSE_FILE: infra/deploy/y2k-nav/docker-compose.yml
      COMPOSE_SERVICE_NAME: y2k-nav
      CONTAINER_NAME: ${{ vars.Y2K_NAV_CONTAINER_NAME || 'y2k-nav' }}
      HOST_BIND: ${{ vars.Y2K_NAV_HOST_BIND || vars.HOST_BIND || '0.0.0.0' }}
      HOST_PORT: ${{ vars.Y2K_NAV_PORT || '33148' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with docker compose
        shell: bash
        run: bash scripts/deploy-docker-app.sh