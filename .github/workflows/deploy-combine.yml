name: deploy-combine

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-combine
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check directive + pre-release filter
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate check
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"

          if [[ "$TAG" == *-* ]]; then
            echo "Skipping pre-release tag: $TAG"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --format=%B "${{ github.sha }}")
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qiE '\[(deploy all|deploy combine|deploy fufu-combine)\]'; then
            echo "Deploy directive found"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No combine deploy directive; skipping"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify fufu-combine
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/fufu-combine/go.mod
          cache-dependency-path: apps/fufu-combine/go.sum

      - name: Run Go tests
        working-directory: apps/fufu-combine
        run: go test ./...

  docker:
    name: Build + push fufu-combine image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-fufu-combine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/fufu-combine
          push: true
          build-args: |
            GO_IMAGE=${{ vars.FUFU_COMBINE_GO_IMAGE || 'golang:1.25-alpine' }}
            RUNTIME_IMAGE=${{ vars.FUFU_COMBINE_RUNTIME_IMAGE || 'alpine:3.22' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=fufu-combine
          cache-to: type=gha,mode=max,scope=fufu-combine

  deploy:
    name: Deploy fufu-combine
    needs: docker
    runs-on: ubuntu-latest
    environment: toolskit
    env:
      APP_NAME: fufu-combine
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-fufu-combine
      APP_TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ vars.REGISTRY_USER || secrets.GHCR_USERNAME || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD || secrets.GHCR_TOKEN || github.token }}
      SSH_HOST: ${{ vars.SSH_HOST || vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.SSH_USER || vars.DEPLOY_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.FUFU_COMBINE_DEPLOY_PATH || vars.COMBINE_DEPLOY_PATH || vars.DEPLOY_PATH && format('{0}/fufu-combine', vars.DEPLOY_PATH) || '/data/docker/fufu-combine' }}
      COMPOSE_FILE: infra/deploy/fufu-combine/docker-compose.yml
      COMPOSE_SERVICE_NAME: fufu-combine
      CONTAINER_NAME: ${{ vars.FUFU_COMBINE_CONTAINER_NAME || 'fufu-combine' }}
      HOST_BIND: ${{ vars.FUFU_COMBINE_HOST_BIND || vars.HOST_BIND || '0.0.0.0' }}
      HOST_PORT: ${{ vars.FUFU_COMBINE_HOST_PORT || vars.COMBINE_PORT || '33147' }}
      FUFU_COMBINE_API_URL: ${{ vars.FUFU_COMBINE_API_URL || vars.NEWAPI_API_SITE_URL }}
      FUFU_COMBINE_API_TOKEN: ${{ secrets.FUFU_COMBINE_API_TOKEN || secrets.NEWAPI_API_SITE_TOKEN }}
      FUFU_COMBINE_USER_ID: ${{ vars.FUFU_COMBINE_USER_ID || '1' }}
      FUFU_COMBINE_QUOTA_UNIT: ${{ vars.FUFU_COMBINE_QUOTA_UNIT || '500000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with docker compose
        shell: bash
        run: bash scripts/deploy-docker-app.sh
