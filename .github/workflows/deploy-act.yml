name: deploy-act

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-act
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  check:
    name: Check directive + pre-release filter
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate check
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"

          if [[ "$TAG" == *-* ]]; then
            echo "Skipping pre-release tag: $TAG"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --format=%B "${{ github.sha }}")
          echo "Commit message: $MSG"

          if echo "$MSG" | grep -qiE '\[(deploy all|deploy act|deploy activity|deploy fufu-act)\]'; then
            echo "Deploy directive found"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No act deploy directive; skipping"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify fufu-act
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/fufu-act/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/fufu-act

      - name: Syntax check
        run: npm run test:act

  docker:
    name: Build + push fufu-act image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-fufu-act
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/fufu-act
          push: true
          build-args: |
            BASE_IMAGE=${{ vars.FUFU_ACT_BASE_IMAGE || 'node:22-bookworm-slim' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=fufu-act
          cache-to: type=gha,mode=max,scope=fufu-act

  deploy:
    name: Deploy fufu-act
    needs: docker
    runs-on: ubuntu-latest
    environment: docker
    env:
      APP_NAME: fufu-act
      APP_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}-fufu-act
      APP_TAG: ${{ github.ref_name }}
      REGISTRY: ghcr.io
      REGISTRY_USER: ${{ secrets.GHCR_USERNAME || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.GHCR_TOKEN || github.token }}
      SSH_HOST: ${{ vars.SSH_HOST || vars.DEPLOY_HOST }}
      SSH_USER: ${{ vars.SSH_USER || vars.DEPLOY_USER }}
      SSH_PORT: ${{ vars.SSH_PORT || vars.DEPLOY_PORT || '22' }}
      SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY || secrets.DEPLOY_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS || vars.SSH_KNOWN_HOSTS }}
      DEPLOY_PATH: ${{ vars.FUFU_ACT_DEPLOY_PATH || '/data/docker/fufu-act' }}
      COMPOSE_FILE: infra/deploy/fufu-act/docker-compose.yml
      COMPOSE_SERVICE_NAME: fufu-act
      CONTAINER_NAME: ${{ vars.FUFU_ACT_CONTAINER_NAME || 'fufu-act' }}
      HOST_BIND: ${{ vars.FUFU_ACT_HOST_BIND || vars.HOST_BIND || '0.0.0.0' }}
      HOST_PORT: ${{ vars.FUFU_ACT_HOST_PORT || '18820' }}
      FUFU_API_BASE_URL: ${{ vars.FUFU_API_BASE_URL || vars.NEWAPI_API_SITE_URL }}
      FUFU_API_TOKEN: ${{ secrets.FUFU_API_TOKEN || secrets.NEWAPI_API_SITE_TOKEN }}
      FUFU_API_USER_ID: ${{ vars.FUFU_API_USER_ID || '1' }}
      FUFU_QUOTA_UNIT: ${{ vars.FUFU_QUOTA_UNIT || '500000' }}
      NEWAPI_API_SITE_URL: ${{ vars.NEWAPI_API_SITE_URL }}
      NEWAPI_API_SITE_TOKEN: ${{ secrets.NEWAPI_API_SITE_TOKEN }}
      NEWAPI_TOKEN_SITE_TOKEN: ${{ secrets.NEWAPI_TOKEN_SITE_TOKEN }}
      MCY_BASE_URL: ${{ vars.MCY_BASE_URL }}
      MCY_COOKIE: ${{ secrets.MCY_COOKIE }}
      MCY_USERNAME: ${{ secrets.MCY_USERNAME || vars.MCY_USERNAME }}
      MCY_PASSWORD: ${{ secrets.MCY_PASSWORD }}
      MCY_LOGIN_ENDPOINT: ${{ vars.MCY_LOGIN_ENDPOINT || '/admin/login' }}
      MCY_UPLOAD_ENDPOINT: ${{ vars.MCY_UPLOAD_ENDPOINT || '/plugin/virtual-card-ship/card/add' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy with docker compose
        shell: bash
        run: bash scripts/deploy-docker-app.sh
