services:
  fufu-act:
    image: ${APP_IMAGE:?APP_IMAGE is required}:${APP_TAG:?APP_TAG is required}
    container_name: ${CONTAINER_NAME:-fufu-act}
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-0.0.0.0}:${HOST_PORT:-18820}:18820"
    environment:
      SLOT_PORT: 18820
      FUFU_API_BASE_URL: ${FUFU_API_BASE_URL:-}
      FUFU_API_TOKEN: ${FUFU_API_TOKEN:-}
      FUFU_API_USER_ID: ${FUFU_API_USER_ID:-1}
      FUFU_QUOTA_UNIT: ${FUFU_QUOTA_UNIT:-500000}
      NEWAPI_API_SITE_URL: ${NEWAPI_API_SITE_URL:-}
      NEWAPI_API_SITE_TOKEN: ${NEWAPI_API_SITE_TOKEN:-}
      NEWAPI_TOKEN_SITE_TOKEN: ${NEWAPI_TOKEN_SITE_TOKEN:-}
      MCY_BASE_URL: ${MCY_BASE_URL:-}
      MCY_COOKIE: ${MCY_COOKIE:-}
      MCY_USERNAME: ${MCY_USERNAME:-}
      MCY_PASSWORD: ${MCY_PASSWORD:-}
      MCY_LOGIN_ENDPOINT: ${MCY_LOGIN_ENDPOINT:-/admin/login}
      MCY_UPLOAD_ENDPOINT: ${MCY_UPLOAD_ENDPOINT:-/plugin/virtual-card-ship/card/add}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18820/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
